version: "3.9"

services:
  # ── iCore Agent API ────────────────────────────────────
  icore-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: icore-agent:dev
    container_name: icore-agent
    restart: unless-stopped
    ports:
      - ${BACKEND_PORT_BIND:-8080:8080}
    environment:
      - DEBUG=true
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      # Hot-reload in dev: mount source
      - ./src:/app/src:ro
      # Sequential agent workspace
      - seq-workspace:/tmp/icore-seq-workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - icore-net

  # ── PostgreSQL (relational user data) ─────────────────
  postgres:
    image: postgres:16-alpine
    container_name: icore-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-icore_agent}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-change-me}
      - POSTGRES_DB=${DB_NAME:-icore_agent_db}
    volumes:
      - icore_db:/var/lib/postgresql/data
      - ./scripts/init-test-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - icore-net

  # ── Redis (conversation memory & task queue) ───────────
  redis:
    image: redis:7-alpine
    container_name: icore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - icore-net

volumes:
  icore_db:
  redis-data:
  seq-workspace:

networks:
  icore-net:
    driver: bridge
