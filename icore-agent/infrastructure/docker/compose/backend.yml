services:
  # Named volumes are created root-owned on first use, but icore-agent runs as
  # the unprivileged `icore` user (uid/gid 999 — see Dockerfile). Without this
  # one-shot chown, PiWorkspaceService.extract_into_sandbox fails with
  # PermissionError when it tries to mkdir inside the shared sandbox volume.
  # Idempotent — safe to run on every `up`.
  pi-workspace-volume-init:
    image: busybox:latest
    container_name: icore-pi-workspace-volume-init
    restart: 'no'
    command: ['sh', '-c', 'chown -R 999:999 /workspace/projects && echo "pi-projects-workspace ownership ok"']
    volumes:
      - pi-projects-workspace:/workspace/projects
    networks:
      - icore-net

  icore-agent:
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: runtime
      extra_hosts:
        - 'host.docker.internal:host-gateway'
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1,::1,localaddress,.localdomain}
        http_proxy: ${BUILD_HTTP_PROXY:-}
        https_proxy: ${BUILD_HTTPS_PROXY:-}
        no_proxy: ${BUILD_NO_PROXY:-localhost,127.0.0.1,::1,localaddress,.localdomain}
        PIP_INDEX_URL: ${BUILD_PIP_INDEX_URL:-}
        PIP_EXTRA_INDEX_URL: ${BUILD_PIP_EXTRA_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${BUILD_PIP_TRUSTED_HOST:-}
        PIP_TIMEOUT: ${BUILD_PIP_TIMEOUT:-120}
    image: icore-agent:dev
    container_name: icore-agent
    restart: unless-stopped
    env_file:
      - ../../../dotenv/.env.app
      - ../../../dotenv/.env.database
      - ../../../dotenv/.env.llm
      - ../../../dotenv/.env.sequential
      - ../../../dotenv/.env.memory
      - ../../../dotenv/.env.auth
      - ../../../dotenv/.env.rag
      - ../../../dotenv/.env.tools
      - ../../../dotenv/.env.media
      - ../../../dotenv/.env.storage
      - ../../../dotenv/.env.pi
    environment:
      STORAGE_SERVICE_URL: ${STORAGE_SERVICE_URL:-http://storage-service:8090}
      STORAGE_SERVICE_TOKEN: ${STORAGE_SERVICE_TOKEN:-dev-storage-service-token}
      STORAGE_SERVICE_TIMEOUT: ${STORAGE_SERVICE_TIMEOUT:-30}
      LOGGING_SERVICE_URL: ${LOGGING_SERVICE_URL:-http://logging-service:8091}
      LOGGING_SERVICE_TOKEN: ${LOGGING_SERVICE_TOKEN:-dev-logging-service-token}
      LOGGING_SERVICE_TIMEOUT: ${LOGGING_SERVICE_TIMEOUT:-2.0}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},postgres,redis,minio,kafka,storage-service,logging-service,icore-agent,icore-postgres,icore-redis,icore-minio,icore-kafka,icore-storage-service,icore-logging-service
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1},postgres,redis,minio,kafka,storage-service,logging-service,icore-agent,icore-postgres,icore-redis,icore-minio,icore-kafka,icore-storage-service,icore-logging-service
    expose:
      - '${API_PORT:-11001}'
    volumes:
      - ../../../src:/app/src:ro
      - seq-workspace:/tmp/icore-seq-workspace
      # Pi mode: extracted project sandboxes live here (path matches
      # `pi_workspace_sandbox_root` default and pi-service's PI_WORKSPACE_ROOT).
      - pi-projects-workspace:/workspace/projects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-service:
        condition: service_healthy
      logging-service:
        condition: service_healthy
      pi-service:
        condition: service_started
    networks:
      - icore-net
    healthcheck:
      test: ['CMD-SHELL', 'curl -f "http://localhost:$${API_PORT:-11001}/health"']
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5

  payment-events-consumer:
    image: icore-agent:dev
    container_name: icore-payment-events-consumer
    restart: unless-stopped
    command: python -m icore_agent.workers.payment_events
    env_file:
      - ../../../dotenv/.env.database
    environment:
      PAYMENT_EVENTS_KAFKA_BROKERS: ${PAYMENT_KAFKA_BROKERS:-kafka:9092}
      PAYMENT_EVENTS_KAFKA_TOPIC: ${PAYMENT_KAFKA_TOPIC:-payment.events.v1}
      PAYMENT_EVENTS_GROUP_ID: ${PAYMENT_EVENTS_GROUP_ID:-icore-agent-payment-events}
      PAYMENT_EVENTS_POLL_TIMEOUT_MS: ${PAYMENT_EVENTS_POLL_TIMEOUT_MS:-1000}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},postgres,kafka,icore-agent,icore-postgres,icore-kafka
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1},postgres,kafka,icore-agent,icore-postgres,icore-kafka
    volumes:
      - ../../../src:/app/src:ro
    depends_on:
      icore-agent:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - icore-net
