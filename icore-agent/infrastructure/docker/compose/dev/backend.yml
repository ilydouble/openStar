services:
  icore-agent:
    build:
      context: ../../../..
      dockerfile: Dockerfile
      target: runtime
      extra_hosts:
        - 'host.docker.internal:host-gateway'
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1,::1,localaddress,.localdomain}
        http_proxy: ${BUILD_HTTP_PROXY:-}
        https_proxy: ${BUILD_HTTPS_PROXY:-}
        no_proxy: ${BUILD_NO_PROXY:-localhost,127.0.0.1,::1,localaddress,.localdomain}
        PIP_INDEX_URL: ${BUILD_PIP_INDEX_URL:-}
        PIP_EXTRA_INDEX_URL: ${BUILD_PIP_EXTRA_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${BUILD_PIP_TRUSTED_HOST:-}
        PIP_TIMEOUT: ${BUILD_PIP_TIMEOUT:-120}
    image: icore-agent:dev
    container_name: icore-agent
    restart: unless-stopped
    env_file:
      - ${ICORE_COMPOSE_DOTENV_DIR}/.env.app${ICORE_COMPOSE_ENV_SUFFIX:-}
      - ${ICORE_COMPOSE_DOTENV_DIR}/.env.database${ICORE_COMPOSE_ENV_SUFFIX:-}
      - ${ICORE_COMPOSE_DOTENV_DIR}/.env.llm${ICORE_COMPOSE_ENV_SUFFIX:-}
      - ${ICORE_COMPOSE_DOTENV_DIR}/.env.memory${ICORE_COMPOSE_ENV_SUFFIX:-}
      - ${ICORE_COMPOSE_DOTENV_DIR}/.env.auth${ICORE_COMPOSE_ENV_SUFFIX:-}
      - ${ICORE_COMPOSE_DOTENV_DIR}/.env.rag${ICORE_COMPOSE_ENV_SUFFIX:-}
      - ${ICORE_COMPOSE_DOTENV_DIR}/.env.tools${ICORE_COMPOSE_ENV_SUFFIX:-}
      - ${ICORE_COMPOSE_DOTENV_DIR}/.env.media${ICORE_COMPOSE_ENV_SUFFIX:-}
      - ${ICORE_COMPOSE_DOTENV_DIR}/.env.storage${ICORE_COMPOSE_ENV_SUFFIX:-}
    environment:
      STORAGE_SERVICE_URL: ${STORAGE_SERVICE_URL:-http://storage-service:8090}
      STORAGE_SERVICE_TOKEN: ${STORAGE_SERVICE_TOKEN:-dev-storage-service-token}
      STORAGE_SERVICE_TIMEOUT: ${STORAGE_SERVICE_TIMEOUT:-30}
      LOGGING_SERVICE_URL: ${LOGGING_SERVICE_URL:-http://logging-service:8091}
      LOGGING_SERVICE_TOKEN: ${LOGGING_SERVICE_TOKEN:-dev-logging-service-token}
      LOGGING_SERVICE_TIMEOUT: ${LOGGING_SERVICE_TIMEOUT:-2.0}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},postgres,redis,minio,kafka,storage-service,logging-service,icore-agent,icore-postgres,icore-redis,icore-minio,icore-kafka,icore-storage-service,icore-logging-service
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1},postgres,redis,minio,kafka,storage-service,logging-service,icore-agent,icore-postgres,icore-redis,icore-minio,icore-kafka,icore-storage-service,icore-logging-service
    expose:
      - '${API_PORT:-11001}'
    volumes:
      - ../../../../src:/app/src:ro
      - agent-tool-workspace:/tmp/icore-agent-workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-service:
        condition: service_healthy
      logging-service:
        condition: service_healthy
    networks:
      - icore-net
    healthcheck:
      test: ['CMD-SHELL', 'curl -f "http://localhost:$${API_PORT:-11001}/health"']
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5

  payment-events-consumer:
    image: icore-agent:dev
    container_name: icore-payment-events-consumer
    restart: unless-stopped
    command: python -m icore_agent.contexts.payment.interfaces.worker.payment_events
    env_file:
      - ${ICORE_COMPOSE_DOTENV_DIR}/.env.database${ICORE_COMPOSE_ENV_SUFFIX:-}
    environment:
      PAYMENT_EVENTS_KAFKA_BROKERS: ${PAYMENT_KAFKA_BROKERS:-kafka:9092}
      PAYMENT_EVENTS_KAFKA_TOPIC: ${PAYMENT_KAFKA_TOPIC:-payment.events.v1}
      PAYMENT_EVENTS_GROUP_ID: ${PAYMENT_EVENTS_GROUP_ID:-icore-agent-payment-events}
      PAYMENT_EVENTS_POLL_TIMEOUT_MS: ${PAYMENT_EVENTS_POLL_TIMEOUT_MS:-1000}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},postgres,kafka,icore-agent,icore-postgres,icore-kafka
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1},postgres,kafka,icore-agent,icore-postgres,icore-kafka
    volumes:
      - ../../../../src:/app/src:ro
    depends_on:
      icore-agent:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - icore-net
