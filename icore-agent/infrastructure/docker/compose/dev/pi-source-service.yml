services:
  pi-service:
    build:
      context: ../../../../../
      dockerfile: pi-source-service/Dockerfile
    image: pi-source-service:dev
    container_name: icore-pi-service
    restart: unless-stopped
    env_file:
      - ${ICORE_COMPOSE_DOTENV_DIR}/.env.pi${ICORE_COMPOSE_ENV_SUFFIX:-}
      - ${ICORE_COMPOSE_DOTENV_DIR}/.env.llm${ICORE_COMPOSE_ENV_SUFFIX:-}
    environment:
      PI_SERVICE_PORT: ${PI_SERVICE_PORT:-11002}
      # Per-project sandbox root — must match the path icore-agent extracts
      # uploaded projects into (`pi_workspace_sandbox_root`, mounted from the
      # same shared volume below). chat requests' `workspace_dir` is rejected
      # unless it resolves inside this root (see resolveSandboxWorkspace).
      PI_WORKSPACE_ROOT: /workspace/projects
    expose:
      - '${PI_SERVICE_PORT:-11002}'
    volumes:
      # Shared with backend: backend extracts uploaded project archives here,
      # Pi's sandboxed read-only tools are pointed at subdirectories of it.
      - pi-projects-workspace:/workspace/projects
    networks:
      - icore-net
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- "http://localhost:$${PI_SERVICE_PORT:-11002}/health" || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
