services:
  gateway:
    build:
      context: ../../../src/icore_agent/services
      dockerfile: gateway/Dockerfile
      extra_hosts:
        - 'host.docker.internal:host-gateway'
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1,::1,localaddress,.localdomain}
        http_proxy: ${BUILD_HTTP_PROXY:-}
        https_proxy: ${BUILD_HTTPS_PROXY:-}
        no_proxy: ${BUILD_NO_PROXY:-localhost,127.0.0.1,::1,localaddress,.localdomain}
        GOPROXY: ${BUILD_GOPROXY:-https://goproxy.cn,direct}
        GOSUMDB: ${BUILD_GOSUMDB:-sum.golang.org}
        GONOPROXY: ${BUILD_GONOPROXY:-}
        GONOSUMDB: ${BUILD_GONOSUMDB:-}
    image: icore-gateway:dev
    container_name: icore-gateway
    restart: unless-stopped
    environment:
      GATEWAY_ADDR: ${GATEWAY_ADDR:-:11000}
      GATEWAY_BACKEND_URL: ${GATEWAY_BACKEND_URL:-http://icore-agent:11001}
      GATEWAY_LOGGING_SERVICE_NAME: ${GATEWAY_LOGGING_SERVICE_NAME:-icore-gateway}
      GATEWAY_LOGGING_SERVICE_TIMEOUT: ${GATEWAY_LOGGING_SERVICE_TIMEOUT:-2s}
      GATEWAY_ACCESS_LOG_QUEUE_SIZE: ${GATEWAY_ACCESS_LOG_QUEUE_SIZE:-4096}
      GATEWAY_TIME_ZONE: ${GATEWAY_TIME_ZONE:-Asia/Shanghai}
      GATEWAY_RATE_LIMIT_WINDOW: ${GATEWAY_RATE_LIMIT_WINDOW:-1m}
      GATEWAY_RATE_LIMIT_WINDOW_LIMIT: ${GATEWAY_RATE_LIMIT_WINDOW_LIMIT:-600}
      GATEWAY_RATE_LIMIT_KEY_PREFIX: ${GATEWAY_RATE_LIMIT_KEY_PREFIX:-icore-gateway:rate}
      GATEWAY_READ_HEADER_TIMEOUT: ${GATEWAY_READ_HEADER_TIMEOUT:-5s}
      GATEWAY_READ_TIMEOUT: ${GATEWAY_READ_TIMEOUT:-30s}
      GATEWAY_WRITE_TIMEOUT: ${GATEWAY_WRITE_TIMEOUT:-120s}
      GATEWAY_IDLE_TIMEOUT: ${GATEWAY_IDLE_TIMEOUT:-60s}
      GATEWAY_SHUTDOWN_TIMEOUT: ${GATEWAY_SHUTDOWN_TIMEOUT:-10s}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in dotenv/.env.auth}
      JWT_ISSUER: ${JWT_ISSUER:-icore-agent}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-icore-gateway}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LOGGING_SERVICE_URL: ${LOGGING_SERVICE_URL:-http://logging-service:8091}
      LOGGING_SERVICE_TOKEN: ${LOGGING_SERVICE_TOKEN:-dev-logging-service-token}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},postgres,redis,minio,kafka,storage-service,logging-service,icore-agent,gateway,icore-postgres,icore-redis,icore-minio,icore-kafka,icore-storage-service,icore-logging-service,icore-gateway
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1},postgres,redis,minio,kafka,storage-service,logging-service,icore-agent,gateway,icore-postgres,icore-redis,icore-minio,icore-kafka,icore-storage-service,icore-logging-service,icore-gateway
    ports:
      - '${GATEWAY_PORT_BIND:-11000:11000}'
    depends_on:
      redis:
        condition: service_healthy
      icore-agent:
        condition: service_healthy
      logging-service:
        condition: service_healthy
    networks:
      - icore-net
    healthcheck:
      test: ['CMD-SHELL', 'port="$${GATEWAY_ADDR##*:}"; wget -Y off -qO- "http://127.0.0.1:$${port:-11000}/health"']
      interval: 30s
      timeout: 10s
      retries: 5
