services:
  minio:
    image: minio/minio:latest
    container_name: icore-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in dotenv/.env.minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in dotenv/.env.minio}
    ports:
      - '${MINIO_API_PORT_BIND:-127.0.0.1:9000:9000}'
      - '${MINIO_CONSOLE_PORT_BIND:-127.0.0.1:9001:9001}'
    volumes:
      - minio-data:/data
    networks:
      - icore-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: icore-minio-init
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in dotenv/.env.minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in dotenv/.env.minio}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/icore-agent-images &&
      mc mb --ignore-existing local/icore-agent-attachments &&
      mc anonymous set none local/icore-agent-images &&
      mc anonymous set none local/icore-agent-attachments
      "
    networks:
      - icore-net
