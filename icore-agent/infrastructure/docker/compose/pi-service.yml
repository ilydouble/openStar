services:
  pi-service:
    build:
      context: ../../../../pi-service
      dockerfile: Dockerfile
    image: pi-service:dev
    container_name: icore-pi-service
    restart: unless-stopped
    env_file:
      - ../../../dotenv/.env.pi
      - ../../../dotenv/.env.llm
    environment:
      PI_SERVICE_PORT: ${PI_SERVICE_PORT:-11002}
    expose:
      - '${PI_SERVICE_PORT:-11002}'
    networks:
      - icore-net
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- "http://localhost:$${PI_SERVICE_PORT:-11002}/health" || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
