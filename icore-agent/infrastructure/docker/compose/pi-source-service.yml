services:
  pi-service:
    build:
      context: ../../../../
      dockerfile: pi-source-service/Dockerfile
    image: pi-source-service:dev
    container_name: icore-pi-service
    restart: unless-stopped
    env_file:
      - ../../../dotenv/.env.pi
      - ../../../dotenv/.env.llm
    environment:
      PI_SERVICE_PORT: ${PI_SERVICE_PORT:-11002}
    expose:
      - '${PI_SERVICE_PORT:-11002}'
    volumes:
      - /mnt/c/Users/Turqut/openStar2/pi-source-service:/workspace:ro
    networks:
      - icore-net
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- "http://localhost:$${PI_SERVICE_PORT:-11002}/health" || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
