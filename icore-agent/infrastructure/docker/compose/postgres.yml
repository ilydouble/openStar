services:
  postgres:
    image: postgres:16-alpine
    container_name: icore-postgres
    restart: unless-stopped
    ports:
      - '${DB_HOST_PORT:-5432}:${DB_INTERNAL_PORT:-5432}'
    environment:
      POSTGRES_USER: ${DB_USER:-icore_agent}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: ${DB_NAME:-icore_agent_db}
      DB_INTERNAL_PORT: ${DB_INTERNAL_PORT:-5432}
    command: ['postgres', '-p', '${DB_INTERNAL_PORT:-5432}']
    volumes:
      - icore_db:/var/lib/postgresql/data
      - ../../../scripts/init-test-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro
    networks:
      - icore-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p $${DB_INTERNAL_PORT:-5432}']
      interval: 10s
      timeout: 5s
      retries: 5
