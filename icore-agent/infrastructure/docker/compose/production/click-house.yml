services:
  clickhouse-migrate:
    build:
      context: ../../../clickhouse
      dockerfile: Dockerfile.migrate
    image: ${CLICKHOUSE_MIGRATE_IMAGE:-icore-clickhouse-migrate:production}
    container_name: icore-clickhouse-migrate
    restart: 'no'
    env_file:
      - ${ICORE_COMPOSE_DOTENV_DIR}/.env.clickhouse${ICORE_COMPOSE_ENV_SUFFIX:-}
    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-127.0.0.1}
      CLICKHOUSE_NATIVE_PORT: ${CLICKHOUSE_HOST_NATIVE_PORT:-9000}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-icore_logging_db}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-icore_logging}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in dotenv/production/.env.clickhouse}
    network_mode: host

  clickhouse-writer:
    build:
      context: ../../../../src/icore_agent/services
      dockerfile: logging-service/Dockerfile
      extra_hosts:
        - 'host.docker.internal:host-gateway'
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1,::1,localaddress,.localdomain}
        http_proxy: ${BUILD_HTTP_PROXY:-}
        https_proxy: ${BUILD_HTTPS_PROXY:-}
        no_proxy: ${BUILD_NO_PROXY:-localhost,127.0.0.1,::1,localaddress,.localdomain}
        GOPROXY: ${BUILD_GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${BUILD_GOSUMDB:-sum.golang.org}
        GONOPROXY: ${BUILD_GONOPROXY:-}
        GONOSUMDB: ${BUILD_GONOSUMDB:-}
    image: ${LOGGING_SERVICE_IMAGE:-icore-logging-service:production}
    container_name: icore-clickhouse-writer
    restart: unless-stopped
    command: ['clickhouse-writer']
    env_file:
      - ${ICORE_COMPOSE_DOTENV_DIR}/.env.logging${ICORE_COMPOSE_ENV_SUFFIX:-}
      - ${ICORE_COMPOSE_DOTENV_DIR}/.env.clickhouse${ICORE_COMPOSE_ENV_SUFFIX:-}
    environment:
      LOGGING_KAFKA_BROKERS: ${LOGGING_KAFKA_BROKERS:-127.0.0.1:${KAFKA_HOST_PORT:-9092}}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-127.0.0.1}
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HOST_HTTP_PORT:-8123}
      CLICKHOUSE_HTTP_URL: ${CLICKHOUSE_HTTP_URL:-http://127.0.0.1:${CLICKHOUSE_HOST_HTTP_PORT:-8123}}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-icore_logging_db}
      CLICKHOUSE_LOGS_TABLE: ${CLICKHOUSE_LOGS_TABLE:-icore_logs}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-icore_logging}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in dotenv/production/.env.clickhouse}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1}
    network_mode: host
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse-migrate:
        condition: service_completed_successfully
