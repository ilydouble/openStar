services:
  gateway:
    build:
      context: ../../../../src/icore_agent/services
      dockerfile: gateway/Dockerfile
      extra_hosts:
        - 'host.docker.internal:host-gateway'
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1,::1,localaddress,.localdomain}
        http_proxy: ${BUILD_HTTP_PROXY:-}
        https_proxy: ${BUILD_HTTPS_PROXY:-}
        no_proxy: ${BUILD_NO_PROXY:-localhost,127.0.0.1,::1,localaddress,.localdomain}
        GOPROXY: ${BUILD_GOPROXY:-https://goproxy.cn,direct}
        GOSUMDB: ${BUILD_GOSUMDB:-sum.golang.org}
        GONOPROXY: ${BUILD_GONOPROXY:-}
        GONOSUMDB: ${BUILD_GONOSUMDB:-}
    image: ${GATEWAY_IMAGE:-icore-gateway:production}
    container_name: icore-gateway
    restart: unless-stopped
    env_file:
      - ${ICORE_COMPOSE_DOTENV_DIR}/.env.gateway${ICORE_COMPOSE_ENV_SUFFIX:-}
      - ${ICORE_COMPOSE_DOTENV_DIR}/.env.auth${ICORE_COMPOSE_ENV_SUFFIX:-}
      - ${ICORE_COMPOSE_DOTENV_DIR}/.env.logging${ICORE_COMPOSE_ENV_SUFFIX:-}
      - ${ICORE_COMPOSE_DOTENV_DIR}/.env.memory${ICORE_COMPOSE_ENV_SUFFIX:-}
    environment:
      GATEWAY_BACKEND_URL: ${GATEWAY_BACKEND_URL:-http://127.0.0.1:${API_PORT:-11001}}
      GATEWAY_PAYMENT_SERVICE_URL: ${GATEWAY_PAYMENT_SERVICE_URL:-http://127.0.0.1:${PAYMENT_SERVICE_PORT:-8080}}
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-}
      REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:${REDIS_HOST_PORT:-6379}/0}
      LOGGING_SERVICE_URL: ${LOGGING_SERVICE_URL:-http://127.0.0.1:${LOGGING_SERVICE_HOST_PORT:-8091}}
      LOGGING_SERVICE_TOKEN: ${LOGGING_SERVICE_TOKEN:?set LOGGING_SERVICE_TOKEN in dotenv/production/.env.logging}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1}
    network_mode: host
    depends_on:
      icore-agent:
        condition: service_healthy
      logging-service:
        condition: service_started
      payment-service:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'port="$${GATEWAY_ADDR##*:}"; wget -Y off -qO- "http://127.0.0.1:$${port:-11000}/health"']
      interval: 30s
      timeout: 10s
      retries: 5
