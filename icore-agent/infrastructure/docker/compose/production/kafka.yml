services:
  kafka-init:
    image: apache/kafka:${KAFKA_IMAGE_TAG:-4.2.0}
    container_name: icore-kafka-init
    restart: 'no'
    environment:
      LOGGING_KAFKA_TOPIC: ${LOGGING_KAFKA_TOPIC:-logging.events.v1}
      LOGGING_KAFKA_PARTITIONS: ${LOGGING_KAFKA_PARTITIONS:-${KAFKA_NUM_PARTITIONS:-3}}
      PAYMENT_KAFKA_TOPIC: ${PAYMENT_KAFKA_TOPIC:-payment.events.v1}
      PAYMENT_KAFKA_PARTITIONS: ${PAYMENT_KAFKA_PARTITIONS:-${KAFKA_NUM_PARTITIONS:-3}}
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    command:
      - /bin/sh
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server "$$KAFKA_BOOTSTRAP_SERVERS" \
          --create \
          --if-not-exists \
          --topic "$$LOGGING_KAFKA_TOPIC" \
          --partitions "$$LOGGING_KAFKA_PARTITIONS" \
          --replication-factor "$$KAFKA_REPLICATION_FACTOR"
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server "$$KAFKA_BOOTSTRAP_SERVERS" \
          --describe \
          --topic "$$LOGGING_KAFKA_TOPIC"
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server "$$KAFKA_BOOTSTRAP_SERVERS" \
          --create \
          --if-not-exists \
          --topic "$$PAYMENT_KAFKA_TOPIC" \
          --partitions "$$PAYMENT_KAFKA_PARTITIONS" \
          --replication-factor "$$KAFKA_REPLICATION_FACTOR"
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server "$$KAFKA_BOOTSTRAP_SERVERS" \
          --describe \
          --topic "$$PAYMENT_KAFKA_TOPIC"
    networks:
      default:
        gw_priority: 100
      infra-access: {}
