services:
  minio-init:
    image: minio/mc:latest
    container_name: icore-minio-init
    restart: 'no'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in dotenv/production/.env.minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in dotenv/production/.env.minio}
      MINIO_INTERNAL_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:-http://127.0.0.1:${MINIO_API_PORT:-9000}}
    entrypoint: >
      /bin/sh -c "
      mc alias set local $$MINIO_INTERNAL_ENDPOINT $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/icore-agent-images &&
      mc mb --ignore-existing local/icore-files &&
      mc anonymous set none local/icore-agent-images &&
      mc anonymous set none local/icore-files
      "
    network_mode: host
