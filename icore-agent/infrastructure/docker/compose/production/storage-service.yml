services:
  storage-service:
    build:
      context: ../../../../src/icore_agent/services
      dockerfile: storage-service/Dockerfile
      extra_hosts:
        - 'host.docker.internal:host-gateway'
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1,::1,localaddress,.localdomain}
        http_proxy: ${BUILD_HTTP_PROXY:-}
        https_proxy: ${BUILD_HTTPS_PROXY:-}
        no_proxy: ${BUILD_NO_PROXY:-localhost,127.0.0.1,::1,localaddress,.localdomain}
        GOPROXY: ${BUILD_GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${BUILD_GOSUMDB:-sum.golang.org}
        GONOPROXY: ${BUILD_GONOPROXY:-}
        GONOSUMDB: ${BUILD_GONOSUMDB:-}
    image: ${STORAGE_SERVICE_IMAGE:-icore-storage-service:production}
    container_name: icore-storage-service
    restart: unless-stopped
    env_file:
      - ${ICORE_COMPOSE_DOTENV_DIR}/.env.storage${ICORE_COMPOSE_ENV_SUFFIX:-}
      - ${ICORE_COMPOSE_DOTENV_DIR}/.env.minio${ICORE_COMPOSE_ENV_SUFFIX:-}
    environment:
      STORAGE_SERVICE_ADDR: ${STORAGE_SERVICE_ADDR:-:8090}
      STORAGE_SERVICE_TOKEN: ${STORAGE_SERVICE_TOKEN:?set STORAGE_SERVICE_TOKEN in dotenv/production/.env.storage}
      MINIO_INTERNAL_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?set MINIO_PUBLIC_ENDPOINT in dotenv/production/.env.minio}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in dotenv/production/.env.minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in dotenv/production/.env.minio}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},postgres,redis,minio,kafka,clickhouse,storage-service,logging-service,payment-service,icore-agent,gateway
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1},postgres,redis,minio,kafka,clickhouse,storage-service,logging-service,payment-service,icore-agent,gateway
    networks:
      default:
        gw_priority: 100
      infra-access: {}
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-Y', 'off', '-qO-', 'http://127.0.0.1:8090/health']
      interval: 30s
      timeout: 10s
      retries: 5
