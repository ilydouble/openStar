services:
  redis:
    image: redis:7-alpine
    container_name: icore-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT_BIND:-127.0.0.1:16379:6379}'
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - icore-net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
