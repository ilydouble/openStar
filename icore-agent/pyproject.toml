[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icore-agent"
version = "0.1.0"
description = "iCore Agent Platform — self-built agent runtime"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    # Pydantic
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pydantic[email]",
    "email-validator",
    # LLM routing
    "litellm>=1.50.0",
    # HTTP client
    "httpx>=0.27.0",
    # Env
    "python-dotenv>=1.0.0",
    "PyJWT>=2.8.0",
    # Relational database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    # Redis (conversation memory)
    "redis>=5.0.0",
    "hiredis>=3.0.0",
    # Kafka consumers
    "aiokafka>=0.11.0",
    # Knowledge base / RAG
    "chromadb>=0.5.0",
    "openai>=2.24.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    # Structured data uploads (Data agent) — CSV / Excel parsing
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    # Email
    "resend"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",       # TestClient
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pyright[nodejs]>=1.1.409",
    "autopep8", # Formatter
]

[project.scripts]
icore-agent = "icore_agent.main:start"

[tool.hatch.build.targets.wheel]
packages = ["src/icore_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pyright]
typeCheckingMode = "stanard"
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/venv",
    "**/build",
    "**/dist", "**/node_modules", "**/.*"
]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
reportMissingParameterType = "none"
reportMissingTypeArgument = "none"
reportMissingTypeStubs = "none"
reportPrivateUsage = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
